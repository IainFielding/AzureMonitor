# Keeps the generated files in step with the scripts that generate them.
#
# The workbook JSON and both Grafana dashboards are build output: nobody edits them by hand, and the
# dashboards are derived from the workbook definition. This check regenerates all of them and fails when
# the committed copies differ, which catches a forgotten regenerate, a hand edit, and a change to the
# workbook that was not carried into the dashboards.
name: Generated files

on:
  pull_request:
    branches: ["**"]

# The check only reads the repository, so the token is limited to that.
permissions:
  contents: read

jobs:
  check-generated:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7

      - name: Regenerate the workbook and the Grafana dashboards
        run: |
          python3 src/build_workbook.py
          python3 src/build_firewall_troubleshoot.py
          python3 src/build_backup.py
          python3 src/build_dns_troubleshoot.py
          python3 src/build_changes.py
          python3 src/build_policy_denials.py
          python3 src/build_avd_user.py
          python3 src/build_log_cost.py
          python3 src/build_routing.py
          python3 src/build_avs.py
          python3 src/build_sentinel.py
          python3 src/build_privileged_access.py
          python3 src/build_expiry.py
          python3 src/build_availability.py
          python3 src/build_finops_hubs.py
          python3 src/build_grafana.py

      - name: Fail if the committed files differ
        run: |
          if ! git diff --exit-code --stat -- workbook grafana; then
            echo ""
            echo "::error::The generated files are out of date."
            echo "Run these and commit the result:"
            echo "    python src/build_workbook.py"
            echo "    python src/build_firewall_troubleshoot.py"
            echo "    python src/build_backup.py"
            echo "    python src/build_dns_troubleshoot.py"
            echo "    python src/build_changes.py"
            echo "    python src/build_policy_denials.py"
            echo "    python src/build_avd_user.py"
            echo "    python src/build_log_cost.py"
            echo "    python src/build_routing.py"
            echo "    python src/build_avs.py"
            echo "    python src/build_sentinel.py"
            echo "    python src/build_privileged_access.py"
            echo "    python src/build_expiry.py"
            echo "    python src/build_availability.py"
            echo "    python src/build_finops_hubs.py"
            echo "    python src/build_grafana.py"
            exit 1
          fi
          echo "Generated files match the scripts."
